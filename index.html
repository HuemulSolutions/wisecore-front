<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/assets/wisecore-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisecore</title>
    <link rel="preload" as="image" href="/assets/wisecore-logo.png" />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition: opacity 200ms ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash img {
        width: 120px;
        height: auto;
        opacity: 0;
        animation: splash-fade-in 400ms ease-out forwards;
      }
      #app-splash .splash-bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 40%;
        background: oklch(0.569 0.2218 268.76);
        animation: splash-bar-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-fade-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes splash-bar-slide {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(120%);
        }
      }
    </style>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <div id="app-splash">
      <div class="splash-bar"></div>
      <img src="/assets/wisecore-logo.png" alt="" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
